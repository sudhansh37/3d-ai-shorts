name: Generate Video

on:
  schedule:
    - cron: "30 15 * * *"   # roz raat 21:00 IST (15:30 UTC)
  workflow_dispatch:
    inputs:
      prompt:
        description: "Custom prompt (khali chhodo to prompts.txt se agla uth jayega)"
        required: false
        default: ""
      skip_upload:
        description: "YouTube upload skip karna hai? (true/false)"
        required: false
        default: "false"
      render_backend:
        description: "Render kahan ho"
        required: false
        default: "kaggle"
        type: choice
        options: [kaggle, actions]

concurrency:
  group: generate-video
  cancel-in-progress: false

permissions:
  contents: write

env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt kaggle

      - name: Download Blender (latest 4.5.x) - CPU fallback ke liye
        run: |
          mkdir -p blender_bin
          VER=$(curl -s https://download.blender.org/release/Blender4.5/ \
            | grep -oE 'blender-4\.5\.[0-9]+-linux-x64\.tar\.xz' | sort -uV | tail -1)
          echo "Downloading $VER ..."
          curl -sL "https://download.blender.org/release/Blender4.5/$VER" \
            | tar -xJ -C blender_bin --strip-components=1
          ./blender_bin/blender --version

      - name: Generate scene JSON (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_scene.py \
            --prompt "${{ github.event.inputs.prompt || '' }}" \
            --out generated/scene.json

      - name: Render via Kaggle GPU
        id: kaggle_render
        continue-on-error: true
        if: ${{ github.event.inputs.render_backend != 'actions' && env.KAGGLE_USERNAME != '' }}
        run: |
          mkdir -p kaggle_build
          cp kaggle/kernel-metadata.json kaggle_build/
          python - <<'EOF'
          scene = open("generated/scene.json").read()
          src = open("kaggle/kernel.py").read()
          open("kaggle_build/kernel.py", "w").write(src.replace("{{SCENE_JSON}}", scene))
          print("kernel ready")
          EOF
          kaggle kernels push -p kaggle_build
          # naya version queue hone do (pehle wale ka status na padh le)
          sleep 45
          echo "Kaggle GPU render ka intezaar..."
          ok=""
          for i in $(seq 1 90); do
            ST=$(kaggle kernels status sudhansh37/3d-shorts-render 2>&1 || true)
            echo "[$i] $ST"
            echo "$ST" | grep -qi "complete" && { ok=1; break; }
            echo "$ST" | grep -qiE "error|cancel" && { echo "ERROR: Kaggle kernel fail hua"; exit 1; }
            sleep 20
          done
          if [ -z "$ok" ]; then echo "ERROR: Kaggle kernel 30 min me complete nahi hua"; exit 1; fi
          mkdir -p output
          kaggle kernels output sudhansh37/3d-shorts-render -p output/
          ls -la output/
          test -f output/video.mp4

      - name: Render (CPU fallback - Actions runner pe)
        if: ${{ steps.kaggle_render.outcome != 'success' }}
        run: |
          echo "Kaggle render skip/fail - CPU pe render kar rahe hain (dheema hota hai)"
          mkdir -p output
          ./blender_bin/blender -b -P blender/automation.py -- \
            --scene generated/scene.json \
            --config config/config.json \
            --locations config/locations.json \
            --assets assets \
            --out output
          ls -la output/

      - name: Upload to YouTube
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/youtube_upload.py --video output/video.mp4 --json generated/scene.json

      - name: Save video artifact (download ke liye)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/video.mp4
          retention-days: 14
          if-no-files-found: warn

      - name: Commit results (repo active rakhna zaroori - 60 din rule ka fix)
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "action@github.com"
          git add generated/scene.json prompts/prompts.txt prompts/used.txt
          git commit -m "video: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]" || echo "kuch naya commit karne ko nahi"
          git pull --rebase origin main || echo "pull rebase fail - phir bhi push try"
          git push
